[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Picture Viewer
Author=Atri
Information=壁纸预览，左键切换，右键打开文件夹

[Variables]
PicturePath=C:\Users\Atri\Pictures\壁纸
ImageW=400
ImageH=300

[MeasurePicture]
Measure=Plugin
Plugin=QuotePlugin
PathName=#PicturePath#
Subfolders=0
FileFilter=*.jpg;*.jpeg;*.gif;*.bmp;*.png;*.webp

[MeasureFileName]
Measure=String
String=[MeasurePicture]
RegExpSubstitute=1
Substitute="^.*\\":""

[MeterBackground]
Meter=Image
SolidColor=0,0,0,100
X=0
Y=0
W=#ImageW#
H=(#ImageH#+20)

[MeterImage]
Meter=Image
MeasureName=MeasurePicture
X=0
Y=0
W=#ImageW#
H=#ImageH#
PreserveAspectRatio=1
AntiAlias=1
LeftMouseUpAction=[!Refresh]
RightMouseUpAction=["#PicturePath#"]
MouseOverCursor=Hand

[MeterFileName]
Meter=String
MeasureName=MeasureFileName
X=5
Y=(#ImageH#+2)
W=(#ImageW#-10)
H=18
FontColor=255,255,255,220
FontSize=10
StringEffect=Shadow
FontFace=Segoe UI
AntiAlias=1
ClipString=1
