[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Picture Viewer
Author=Atri
Information=壁纸预览，左键切换，右键打开文件夹

[Variables]
PicturePath=%USERPROFILE%\Pictures\壁纸
ImageW=400
ImageH=300

[MeasurePicture]
Measure=Plugin
Plugin=QuotePlugin
PathName=#PicturePath#
Subfolders=0
FileFilter=*.jpg;*.jpeg;*.gif;*.bmp;*.png;*.webp

[MeasureFileName]
Measure=String
String=[MeasurePicture]
RegExpSubstitute=1
Substitute="^.*\\":""

[MeterImage]
Meter=Image
MeasureName=MeasurePicture
X=0
Y=0
W=#ImageW#
H=#ImageH#
PreserveAspectRatio=1
AntiAlias=1
LeftMouseUpAction=[!Refresh]
RightMouseUpAction=["%USERPROFILE%\Pictures\壁纸"]
MouseOverCursor=Hand

[MeterFileName]
Meter=String
MeasureName=MeasureFileName
X=0
Y=#ImageH#
FontColor=255,255,255,200
FontSize=10
StringEffect=Shadow
FontFace=Segoe UI
AntiAlias=1
