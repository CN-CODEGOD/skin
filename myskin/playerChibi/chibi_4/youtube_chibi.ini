[Rainmeter]
Update=1000
AccurateText=1
DragMargins=0
DesktopWindow=1
SolidColor=0,0,0,1
ClickThrough=0

[Metadata]
Name=Chibi 1
Author=Atri
Information=youtubeChibi

[Variables]
@include=#ROOTCONFIGPATH#stickers\Variables.inc

ImageLeft=#Chib41Image#
ImageWidth=#Chibi1Width#
ImageHeight=#Chibi1Height#
ImagePixel=#ChibiPixel#
[MeterChibi1]
Meter=Image
ImageName=#ImageLeft#
X=0
Y=0
W=#ImageWidth#
H=#ImageHeight#
AntiAlias=1
PreserveAspectRatio=0

MouseOverCursor=[Hand][!HideMeter MeterChibi1][!Showmeter MeterChibi2][!Update]

[MeterChibi2]
Meter=Image
ImageName=#ImagePixel#
X=0
Y=0
W=#ImageWidth#
H=#ImageHeight#
AntiAlias=1
PreserveAspectRatio=0
LeftMouseUpAction=["C:\"]
MouseLeaveCursor=[Hand][!HideMeter MeterChibi2][!Showmeter MeterChibi1][!Update]




