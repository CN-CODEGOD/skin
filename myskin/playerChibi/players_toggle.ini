[Rainmeter]
Update=1000
AccurateText=1
DragMargins=0
DesktopWindow=1
SolidColor=0,0,0,1
ClickThrough=0
DynamicWindowSize=1

[Metadata]
Name=Players Toggle
Author=Atri
Information=Left click to cycle players, right click to toggle via script

[Variables]
@include=#ROOTCONFIGPATH#playerChibi\Variables.inc
IconTimeWaiting=4
IconBaseSize=100
IconMaxSize=150
CurrentIndex=1
TotalImages=5
FireAction=0
ScriptPath=#ROOTCONFIGPATH#playerChibi\players_toggle.ps1

;--- Player names (for script parameter) ---
PlayerName1=cloudmusic
PlayerName2=Spotify
PlayerName3=PotPlayerMini64
PlayerName4=youtube
PlayerName5=stopall

;--- Index measures ---
[MeasureIndex]
Measure=Calc
Formula=#CurrentIndex#
DynamicVariables=1
IfCondition=(MeasureIndex=1)
IfTrueAction=[!SetOption MeterChibi ImageName "#Chibi1Image#"]
IfCondition2=(MeasureIndex=2)
IfTrueAction2=[!SetOption MeterChibi ImageName "#Chibi2Image#"]
IfCondition3=(MeasureIndex=3)
IfTrueAction3=[!SetOption MeterChibi ImageName "#Chibi3Image#"]
IfCondition4=(MeasureIndex=4)
IfTrueAction4=[!SetOption MeterChibi ImageName "#Chibi4Image#"]
IfCondition5=(MeasureIndex=5)
IfTrueAction5=[!SetOption MeterChibi ImageName "#Chibi5Image#"][!UpdateMeter MeterChibi][!Redraw]

[MeasureNextIndex]
Measure=Calc
Formula=([MeasureIndex] % #TotalImages#) + 1
DynamicVariables=1

;--- Right-click toggle action (only fires when FireAction=1) ---
[MeasureAction]
Measure=Calc
Formula=#FireAction#
DynamicVariables=1
IfCondition=(MeasureAction=1) && (#CurrentIndex#=1)
IfTrueAction=[powershell.exe -ExecutionPolicy Bypass -File "#ScriptPath#" "#PlayerName1#" "#CloudMusicPath#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition2=(MeasureAction=1) && (#CurrentIndex#=2)
IfTrueAction2=[powershell.exe -ExecutionPolicy Bypass -File "#ScriptPath#" "#PlayerName2#" "#SpotifyPath#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition3=(MeasureAction=1) && (#CurrentIndex#=3)
IfTrueAction3=[powershell.exe -ExecutionPolicy Bypass -File "#ScriptPath#" "#PlayerName3#" "#PotPlayerPath#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition4=(MeasureAction=1) && (#CurrentIndex#=4)
IfTrueAction4=["#YouTubePath#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition5=(MeasureAction=1) && (#CurrentIndex#=5)
IfTrueAction5=[powershell.exe -ExecutionPolicy Bypass -File "#ScriptPath#" "#PlayerName5#"][!WriteKeyValue Variables FireAction 0][!Refresh]

;--- Hover animation ---
[MeasureHover]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterChibi W "(Clamp([MeterChibi:W]+5,#IconBaseSize#,#IconMaxSize#))"][!SetOption MeterChibi H "(Clamp([MeterChibi:H]+5,#IconBaseSize#,#IconMaxSize#))"][!UpdateMeter MeterChibi][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterChibi W "(Clamp([MeterChibi:W]-5,#IconBaseSize#,#IconMaxSize#))"][!SetOption MeterChibi H "(Clamp([MeterChibi:H]-5,#IconBaseSize#,#IconMaxSize#))"][!UpdateMeter MeterChibi][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

;--- Meter ---
[MeterChibi]
Meter=Image
ImageName=#Chibi1Image#
X=0
Y=0
W=#IconBaseSize#
H=#IconBaseSize#
AntiAlias=1
PreserveAspectRatio=1
SolidColor=0,0,0,1
MouseOverAction=[!CommandMeasure MeasureHover "Stop 2"][!CommandMeasure MeasureHover "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureHover "Stop 1"][!CommandMeasure MeasureHover "Execute 2"]
LeftMouseUpAction=[!WriteKeyValue Variables CurrentIndex "[MeasureNextIndex]"][!Refresh]
RightMouseUpAction=[!WriteKeyValue Variables FireAction 1][!Refresh]
MouseOverCursor=Hand
DynamicVariables=1
