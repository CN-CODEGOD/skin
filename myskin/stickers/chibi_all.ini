;--- Index measures ---
[MeasureIndex]
Measure=Calc
Formula=#CurrentIndex#
DynamicVariables=1
IfCondition=(MeasureIndex=1)
IfTrueAction=[!SetOption MeterChibi ImageName "#Chibi1Image#"]
IfCondition2=(MeasureIndex=2)
IfTrueAction2=[!SetOption MeterChibi ImageName "#Chibi2Image#"]
IfCondition3=(MeasureIndex=3)
IfTrueAction3=[!SetOption MeterChibi ImageName "#Chibi3Image#"]
IfCondition4=(MeasureIndex=4)
IfTrueAction4=[!SetOption MeterChibi ImageName "#Chibi4Image#"]
IfCondition5=(MeasureIndex=5)
IfTrueAction5=[!SetOption MeterChibi ImageName "#Chibi5Image#"]
IfCondition6=(MeasureIndex=6)
IfTrueAction6=[!SetOption MeterChibi ImageName "#Chibi6Image#"]
IfCondition7=(MeasureIndex=7)
IfTrueAction7=[!SetOption MeterChibi ImageName "#Chibi7Image#"]
IfCondition8=(MeasureIndex=8)
IfTrueAction8=[!SetOption MeterChibi ImageName "#Chibi8Image#"]
IfCondition9=(MeasureIndex=9)
IfTrueAction9=[!SetOption MeterChibi ImageName "#Chibi9Image#"]
IfCondition10=(MeasureIndex=10)
IfTrueAction10=[!SetOption MeterChibi ImageName "#Chibi10Image#"]
IfCondition11=(MeasureIndex=11)
IfTrueAction11=[!SetOption MeterChibi ImageName "#Chibi11Image#"]
IfCondition12=(MeasureIndex=12)
IfTrueAction12=[!SetOption MeterChibi ImageName "#Chibi12Image#"][!UpdateMeter MeterChibi][!Redraw]

[MeasureNextIndex]
Measure=Calc
Formula=([MeasureIndex] % #TotalImages#) + 1
DynamicVariables=1

;--- Right-click action (only fires when FireAction=1) ---
[MeasureAction]
Measure=Calc
Formula=#FireAction#
DynamicVariables=1
IfCondition=(MeasureAction=1) && (#CurrentIndex#=1)
IfTrueAction=["#Action1#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition2=(MeasureAction=1) && (#CurrentIndex#=2)
IfTrueAction2=["#Action2#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition3=(MeasureAction=1) && (#CurrentIndex#=3)
IfTrueAction3=["#Action3#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition4=(MeasureAction=1) && (#CurrentIndex#=4)
IfTrueAction4=["#Action4#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition5=(MeasureAction=1) && (#CurrentIndex#=5)
IfTrueAction5=["#Action5#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition6=(MeasureAction=1) && (#CurrentIndex#=6)
IfTrueAction6=["#Action6#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition7=(MeasureAction=1) && (#CurrentIndex#=7)
IfTrueAction7=["#Action7#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition8=(MeasureAction=1) && (#CurrentIndex#=8)
IfTrueAction8=["#Action8#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition9=(MeasureAction=1) && (#CurrentIndex#=9)
IfTrueAction9=["#Action9#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition10=(MeasureAction=1) && (#CurrentIndex#=10)
IfTrueAction10=["#Action10#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition11=(MeasureAction=1) && (#CurrentIndex#=11)
IfTrueAction11=["#Action11#"][!WriteKeyValue Variables FireAction 0][!Refresh]
IfCondition12=(MeasureAction=1) && (#CurrentIndex#=12)
IfTrueAction12=["#Action12#"][!WriteKeyValue Variables FireAction 0][!Refresh]

;--- Hover animation ---
[MeasureHover]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterChibi W "(Clamp([MeterChibi:W]+5,#IconBaseSize#,#IconMaxSize#))"][!SetOption MeterChibi H "(Clamp([MeterChibi:H]+5,#IconBaseSize#,#IconMaxSize#))"][!UpdateMeter MeterChibi][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterChibi W "(Clamp([MeterChibi:W]-5,#IconBaseSize#,#IconMaxSize#))"][!SetOption MeterChibi H "(Clamp([MeterChibi:H]-5,#IconBaseSize#,#IconMaxSize#))"][!UpdateMeter MeterChibi][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

;--- Meter ---
[MeterChibi]
Meter=Image
ImageName=#Chibi1Image#
X=0
Y=0
W=#IconBaseSize#
H=#IconBaseSize#
AntiAlias=1
PreserveAspectRatio=1
SolidColor=0,0,0,1
MouseOverAction=[!CommandMeasure MeasureHover "Stop 2"][!CommandMeasure MeasureHover "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureHover "Stop 1"][!CommandMeasure MeasureHover "Execute 2"]
LeftMouseUpAction=[!WriteKeyValue Variables CurrentIndex "[MeasureNextIndex]"][!Refresh]
RightMouseUpAction=[!WriteKeyValue Variables FireAction 1][!Refresh]
MouseOverCursor=Hand
DynamicVariables=1
