[Rainmeter]
Update=-1
Author=Atri
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc
IconTimeWaiting=4
IconBaseSize=35
IconMaxSize=65

; Folder paths - 3 columns grid
Folder1=C:\Users\Atri\Documents
Folder2=C:\Users\Atri\Downloads
Folder3=C:\Users\Atri\Pictures
Folder4=C:\Users\Atri\Desktop
Folder5=C:\Users\Atri\Music
Folder6=C:\Users\Atri\Videos
Folder7=C:\Users\Atri\Pictures\壁纸
Folder8=C:\Users\Atri\Documents\Rainmeter
Folder9=C:\Users\Atri\workspace
Folder10=C:\
Folder11=C:\Users\Atri\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup
Folder12=C:\Users\Atri

; Folder baseNames (hover tooltip)
Name1=Documents
Name2=Downloads
Name3=Pictures
Name4=Desktop
Name5=Music
Name6=Videos
Name7=壁纸
Name8=Rainmeter
Name9=workspace
Name10=C:\
Name11=Startup
Name12=Atri

;--- Animation measures ---

[MeasureSize1]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterFolder1 W "(Clamp([MeterFolder1:W]+5,#IconBaseSize#,#IconMaxSize#))"][!SetOption MeterFolder1 X "(Clamp([MeterFolder1:X]-2,0,30))"][!SetOption MeterFolder1 Y "(Clamp([MeterFolder1:Y]-2,0,30))"][!UpdateMeterGroup Folders][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterFolder1 W "(Clamp([MeterFolder1:W]-5,#IconBaseSize#,#IconMaxSize#))"][!SetOption MeterFolder1 X "(Clamp([MeterFolder1:X]+2,0,30))"][!SetOption MeterFolder1 Y "(Clamp([MeterFolder1:Y]+2,0,30))"][!UpdateMeterGroup Folders][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

