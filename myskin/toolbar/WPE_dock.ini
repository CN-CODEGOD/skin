[Rainmeter]
Update=-1
Author=Atri
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc
IconTimeWaiting=4

;--- Animation measures ---

[MeasureSize1]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterIcon1 W "(Clamp([MeterIcon1:W]+5,25,65))"][!SetOption MeterIcon1 Y "(Clamp([MeterIcon1:Y]-2,0,30))"][!SetOption MeterIcon1 X "(Clamp([MeterIcon1:X]-2,0,60))"][!UpdateMeterGroup Icons][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterIcon1 W "(Clamp([MeterIcon1:W]-5,25,65))"][!SetOption MeterIcon1 Y "(Clamp([MeterIcon1:Y]+2,0,30))"][!SetOption MeterIcon1 X "(Clamp([MeterIcon1:X]+2,0,60))"][!UpdateMeterGroup Icons][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

[MeasureSize2]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterIcon2 W "(Clamp([MeterIcon2:W]+5,25,65))"][!SetOption MeterIcon2 Y "(Clamp([MeterIcon2:Y]-2,0,30))"][!SetOption MeterIcon2 X "(Clamp([MeterIcon2:X]-2,0,120))"][!UpdateMeterGroup Icons][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterIcon2 W "(Clamp([MeterIcon2:W]-5,25,65))"][!SetOption MeterIcon2 Y "(Clamp([MeterIcon2:Y]+2,0,30))"][!SetOption MeterIcon2 X "(Clamp([MeterIcon2:X]+2,0,120))"][!UpdateMeterGroup Icons][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

[MeasureSize3]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterIcon3 W "(Clamp([MeterIcon3:W]+5,25,65))"][!SetOption MeterIcon3 Y "(Clamp([MeterIcon3:Y]-2,0,30))"][!SetOption MeterIcon3 X "(Clamp([MeterIcon3:X]-2,0,180))"][!UpdateMeterGroup Icons][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterIcon3 W "(Clamp([MeterIcon3:W]-5,25,65))"][!SetOption MeterIcon3 Y "(Clamp([MeterIcon3:Y]+2,0,30))"][!SetOption MeterIcon3 X "(Clamp([MeterIcon3:X]+2,0,180))"][!UpdateMeterGroup Icons][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

;--- Icon meters (horizontal layout, same as toolbar.ini) ---

[MeterIcon1]
Meter=Image
ImageName=#@#images\play.png
X=60
Y=30
W=35
LeftMouseUpAction=["%wpe%" -control play]
MouseOverAction=[!CommandMeasure MeasureSize1 "Stop 2"][!CommandMeasure MeasureSize1 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureSize1 "Stop 1"][!CommandMeasure MeasureSize1 "Execute 2"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1

[MeterIcon2]
Meter=Image
ImageName=#@#images\pause.png
X=120
Y=30
W=35
LeftMouseUpAction=["%wpe%" -control pause]
MouseOverAction=[!CommandMeasure MeasureSize2 "Stop 2"][!CommandMeasure MeasureSize2 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureSize2 "Stop 1"][!CommandMeasure MeasureSize2 "Execute 2"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1

[MeterIcon3]
Meter=Image
ImageName=#@#images\Next.png
X=180
Y=30
W=35
LeftMouseUpAction=["%wpe%" -control nextWallpaper]
MouseOverAction=[!CommandMeasure MeasureSize3 "Stop 2"][!CommandMeasure MeasureSize3 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureSize3 "Stop 1"][!CommandMeasure MeasureSize3 "Execute 2"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1
