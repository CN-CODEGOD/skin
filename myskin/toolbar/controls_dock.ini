[Rainmeter]
Update=100
Author=Atri
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc
IconTimeWaiting=4

;--- WebNowPlaying Measures ---

[MeasurePlayer]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
Substitute="0":"Play","1":"Pause","2":"Play","3":"Play"

[MeasurePlayPause]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
Substitute="0":"play.png","1":"pause.png","2":"play.png"

;--- Animation measures ---

[MeasureSize1]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterIcon1 W "(Clamp([MeterIcon1:W]+5,25,65))"][!SetOption MeterIcon1 X "(Clamp([MeterIcon1:X]-2,0,30))"][!SetOption MeterIcon1 Y "(Clamp([MeterIcon1:Y]-2,0,30))"][!UpdateMeterGroup Icons][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterIcon1 W "(Clamp([MeterIcon1:W]-5,25,65))"][!SetOption MeterIcon1 X "(Clamp([MeterIcon1:X]+2,0,30))"][!SetOption MeterIcon1 Y "(Clamp([MeterIcon1:Y]+2,0,30))"][!UpdateMeterGroup Icons][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

[MeasureSize2]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterIcon2 W "(Clamp([MeterIcon2:W]+5,25,65))"][!SetOption MeterIcon2 X "(Clamp([MeterIcon2:X]-2,0,30))"][!SetOption MeterIcon2 Y "(Clamp([MeterIcon2:Y]-2,0,90))"][!UpdateMeterGroup Icons][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterIcon2 W "(Clamp([MeterIcon2:W]-5,25,65))"][!SetOption MeterIcon2 X "(Clamp([MeterIcon2:X]+2,0,30))"][!SetOption MeterIcon2 Y "(Clamp([MeterIcon2:Y]+2,0,90))"][!UpdateMeterGroup Icons][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

[MeasureSize3]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat SizeUp,#IconTimeWaiting#,4
SizeUp=[!SetOption MeterIcon3 W "(Clamp([MeterIcon3:W]+5,25,65))"][!SetOption MeterIcon3 X "(Clamp([MeterIcon3:X]-2,0,30))"][!SetOption MeterIcon3 Y "(Clamp([MeterIcon3:Y]-2,0,150))"][!UpdateMeterGroup Icons][!Redraw]
ActionList2=Repeat SizeDn,#IconTimeWaiting#,4
SizeDn=[!SetOption MeterIcon3 W "(Clamp([MeterIcon3:W]-5,25,65))"][!SetOption MeterIcon3 X "(Clamp([MeterIcon3:X]+2,0,30))"][!SetOption MeterIcon3 Y "(Clamp([MeterIcon3:Y]+2,0,150))"][!UpdateMeterGroup Icons][!Redraw]
IgnoreWarnings=1
DynamicVariables=1

;--- Icon meters (vertical layout) ---

[MeterIcon1]
Meter=Image
ImageName=#@#images\previous.png
X=30
Y=60
W=35
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Previous"]
MouseOverAction=[!CommandMeasure MeasureSize1 "Stop 2"][!CommandMeasure MeasureSize1 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureSize1 "Stop 1"][!CommandMeasure MeasureSize1 "Execute 2"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1

[MeterIcon2]
Meter=Image
ImageName=#@#images\[MeasurePlayPause]
X=30
Y=120
W=35
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "PlayPause"]
MouseOverAction=[!CommandMeasure MeasureSize2 "Stop 2"][!CommandMeasure MeasureSize2 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureSize2 "Stop 1"][!CommandMeasure MeasureSize2 "Execute 2"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1
DynamicVariables=1

[MeterIcon3]
Meter=Image
ImageName=#@#images\Next.png
X=30
Y=180
W=35
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Next"]
MouseOverAction=[!CommandMeasure MeasureSize3 "Stop 2"][!CommandMeasure MeasureSize3 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureSize3 "Stop 1"][!CommandMeasure MeasureSize3 "Execute 2"]
AntiAlias=1
PreserveAspectRatio=1
Group=Icons
SolidColor=0,0,0,1
