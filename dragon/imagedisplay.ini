[Rainmeter]
Update=1000
AccurateText=1
DragMargins=0
DesktopWindow=1
SolidColor=0,0,0,1
ClickThrough=0

[Metadata]
Name=Dragon Image
Author=Atri
Information=中国龙左右对称贴图

[Variables]
ImageLeft=#@#images\tietu_zhonguolong1.png
ImageRight=#@#images\tietu_zhonguolong_2.png
ImageWidth=300
ImageHeight=400

[MeterDragonLeft]
Meter=Image
ImageName=#ImageLeft#
X=0
Y=0
W=#ImageWidth#
H=#ImageHeight#
AntiAlias=1
PreserveAspectRatio=0

[MeterDragonRight]
Meter=Image
ImageName=#ImageRight#
X=(#ImageWidth#)
Y=0
W=#ImageWidth#
H=#ImageHeight#
AntiAlias=1
PreserveAspectRatio=0
