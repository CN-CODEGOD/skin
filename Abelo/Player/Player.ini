[Rainmeter]
Update=100
Author=Connect-R
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 1 ? 1 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 1 ? 1 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
Scale=1.8

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
Substitute="0":"Play","1":"Pause","2":"Play","3":"Replay"

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
Substitute="":"N/A"

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
Substitute="":"N/A"

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
Substitute="":"0"

[MeasureAlbumArt]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
DefaultPath=#@#Images\nocover.png

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterSongInfo]
Meter=String
MeasureName=MeasureArtist
MeasureName2=MeasureTitle
StringAlign=Left
FontFace=Microsoft YaHei UI
FontColor=#TextColor#
FontSize=(6*#Scale#)
X=(5*#Scale#)
Y=(0*#Scale#)
Text="%1   x   %2"
InlinePattern="\s{3}x\s{3}.*"
InlineSetting=Color | #TextColor#,80
DynamicVariables=1
AntiAlias=1

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterBar]
Meter=Shape
X=(5*#Scale#)
Y=(15*#Scale#)
Shape=Rectangle 0,0,(150*#Scale#),(1*#Scale#),0 | Fill Color #TextColor#,30 | StrokeWidth 0
Shape2=Rectangle 0,0,([MeasureProgress]*1.5*#Scale#),(1*#Scale#),0 | Fill Color #TextColor# | StrokeWidth 0
Shape3=Ellipse ([MeasureProgress]*1.5*#Scale#),(0.5*#Scale#),(1.2*#Scale#) | Fill Color #TextColor# | StrokeWidth 0
Shape4=Ellipse ([MeasureProgress]*1.5*#Scale#),(0.5*#Scale#),(3.4*#Scale#) | Fill Color #TextColor#,50 | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureState "SetPosition $MouseX:%$"]

;-------------------------------------------------------------
; Playback Controls
;-------------------------------------------------------------

[MeterPrevious]
Meter=Image
ImageName=#@#Images\previous.png
ImageTint=#TextColor#
X=(5*#Scale#)
Y=(25*#Scale#)
W=(12*#Scale#)
H=(12*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureState "Previous"]
MouseOverCursor=Hand
AntiAlias=1
PreserveAspectRatio=1

[MeterPlayPause]
Meter=Image
ImageName=#@#Images\[MeasureState].png
ImageTint=#TextColor#
X=(22*#Scale#)
Y=(25*#Scale#)
W=(12*#Scale#)
H=(12*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureState "PlayPause"]
MouseOverCursor=Hand
DynamicVariables=1
AntiAlias=1
PreserveAspectRatio=1

[MeterNext]
Meter=Image
ImageName=#@#Images\Next.png
ImageTint=#TextColor#
X=(39*#Scale#)
Y=(25*#Scale#)
W=(12*#Scale#)
H=(12*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureState "Next"]
MouseOverCursor=Hand
AntiAlias=1
PreserveAspectRatio=1
